<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    /* Theme (1.7.1). Light is the base; the dark block is the look the popup had
       before there was a choice, value for value. "Auto" is the absence of a
       data-theme attribute on <html>, so the system decides in CSS alone; popup.js
       sets data-theme="light" or "dark" to force one.
       The dark block is written twice - once for a dark system, once for a forced
       dark - because CSS cannot share one declaration list between a media query
       and a plain selector. Keep the two identical (tests/run-tests.js checks). */
    :root {
      color-scheme: light;
      --bg: #f4f4fa;
      --fg: #22223a;
      --title: #11112a;
      --muted: #5d5d7c;
      --field: #ffffff;
      --line: rgba(0, 0, 0, 0.2);
      --line-soft: rgba(0, 0, 0, 0.1);
      --focus: rgba(70, 70, 220, 0.6);
      --target-fg: #45456a;
      --accent: #4545d0;
      --btn: #e3e3f6;
      --btn-hover: #d3d3f0;
      --btn-fg: #26264f;
      --info-bg: rgba(70, 70, 220, 0.1);
      --info-fg: #3535b0;
      --ok-bg: rgba(30, 140, 30, 0.12);
      --ok-fg: #1d6b1d;
      --err-bg: rgba(210, 40, 40, 0.1);
      --err-fg: #b3261e;
      --wc-bg: rgba(30, 140, 30, 0.08);
      --hint: #6c6c8a;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) {
        color-scheme: dark;
        --bg: #1a1a2e;
        --fg: #e0e0e0;
        --title: #ffffff;
        --muted: #8888aa;
        --field: #0f0f1e;
        --line: rgba(255, 255, 255, 0.15);
        --line-soft: rgba(255, 255, 255, 0.08);
        --focus: rgba(130, 130, 255, 0.5);
        --target-fg: #b9b9d6;
        --accent: #9a9aff;
        --btn: #2a2a5a;
        --btn-hover: #3a3a7a;
        --btn-fg: #d0d0e8;
        --info-bg: rgba(100, 100, 255, 0.15);
        --info-fg: #aaaaff;
        --ok-bg: rgba(100, 200, 100, 0.15);
        --ok-fg: #6bc96b;
        --err-bg: rgba(255, 100, 100, 0.15);
        --err-fg: #ff6b6b;
        --wc-bg: rgba(100, 200, 100, 0.08);
        --hint: #555577;
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #1a1a2e;
      --fg: #e0e0e0;
      --title: #ffffff;
      --muted: #8888aa;
      --field: #0f0f1e;
      --line: rgba(255, 255, 255, 0.15);
      --line-soft: rgba(255, 255, 255, 0.08);
      --focus: rgba(130, 130, 255, 0.5);
      --target-fg: #b9b9d6;
      --accent: #9a9aff;
      --btn: #2a2a5a;
      --btn-hover: #3a3a7a;
      --btn-fg: #d0d0e8;
      --info-bg: rgba(100, 100, 255, 0.15);
      --info-fg: #aaaaff;
      --ok-bg: rgba(100, 200, 100, 0.15);
      --ok-fg: #6bc96b;
      --err-bg: rgba(255, 100, 100, 0.15);
      --err-fg: #ff6b6b;
      --wc-bg: rgba(100, 200, 100, 0.08);
      --hint: #555577;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--fg);
    }

    h2 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 16px;
      color: var(--title);
    }

    .field {
      margin-bottom: 10px;
    }

    label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="text"],
    select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--field);
      color: var(--fg);
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus,
    select:focus {
      border-color: var(--focus);
    }

    /* What this popup is pointed at. Until now the only clue was the filename
       field, so exporting the wrong tab was found out AFTER the click. */
    #target {
      font-size: 12px;
      line-height: 1.35;
      color: var(--target-fg);
      background: var(--field);
      border: 1px solid var(--line-soft);
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 14px;
      overflow-wrap: anywhere;
    }
    #target .platform {
      color: var(--accent);
      font-weight: 600;
    }
    #target.none {
      color: var(--muted);
    }

    /* A long media export is two silent minutes with one line of text
       changing. A bar is the difference between "working" and "frozen". */
    #progress {
      height: 4px;
      border-radius: 2px;
      background: var(--line-soft);
      margin-top: 10px;
      overflow: hidden;
      display: none;
    }
    #progress.on { display: block; }
    #progress > i {
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6a6aff, #9a9aff);
      transition: width 0.15s linear;
    }

    .divider {
      height: 1px;
      background: var(--line-soft);
      margin: 14px 0;
    }

    .export-section h3 {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .export-buttons {
      display: flex;
      gap: 8px;
    }

    .export-btn {
      flex: 1;
      /* 6px sides: three buttons must fit the 300px popup */
      padding: 10px 6px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--btn);
      color: var(--btn-fg);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      text-align: center;
    }

    .export-btn:hover {
      background: var(--btn-hover);
      transform: scale(1.02);
    }

    .export-btn:active {
      transform: scale(0.98);
    }

    .export-btn .format {
      font-family: monospace;
      font-size: 14px;
      font-weight: 700;
      display: block;
      margin-bottom: 2px;
    }

    .export-btn .desc {
      font-size: 10px;
      color: var(--muted);
    }

    #status {
      margin-top: 10px;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      text-align: center;
      display: none;
    }

    #status.info {
      display: block;
      background: var(--info-bg);
      color: var(--info-fg);
    }

    #status.success {
      display: block;
      background: var(--ok-bg);
      color: var(--ok-fg);
    }

    #status.error {
      display: block;
      background: var(--err-bg);
      color: var(--err-fg);
    }

    #wordcount {
      display: none;
      margin-top: 8px;
      padding: 8px 12px;
      border-radius: 6px;
      background: var(--wc-bg);
      font-size: 11px;
      text-align: center;
      color: var(--muted);
    }

    .wc-label {
      color: var(--muted);
    }

    .wc-num {
      color: var(--btn-fg);
      font-weight: 600;
      font-family: monospace;
    }

    .hint {
      margin-top: 12px;
      font-size: 10.5px;
      color: var(--hint);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h2>AI Chat QuickExport</h2>

  <div id="target" class="none">checking this tab&hellip;</div>

  <div class="field">
    <label>User label</label>
    <input type="text" id="userLabel" placeholder="USER">
  </div>

  <div class="field">
    <label>Assistant label</label>
    <input type="text" id="assistantLabel" placeholder="ASSISTANT">
  </div>

  <div class="field">
    <label>Filename</label>
    <input type="text" id="exportFilename" placeholder="Auto-generated filename">
  </div>

  <div class="field">
    <label for="theme">Theme</label>
    <select id="theme">
      <option value="auto">Auto (follow system)</option>
      <option value="light">Light</option>
      <option value="dark">Dark</option>
    </select>
  </div>

  <div class="divider"></div>

  <div class="export-section">
    <h3>Export current conversation</h3>
    <div class="export-buttons">
      <button class="export-btn" id="exportMd">
        <span class="format">.md</span>
        <span class="desc">Markdown text</span>
      </button>
      <button class="export-btn" id="exportJson">
        <span class="format">.json</span>
        <span class="desc">Structured data</span>
      </button>
      <button class="export-btn" id="exportHtml">
        <span class="format">.html</span>
        <span class="desc">Opens anywhere</span>
      </button>
    </div>
  </div>

  <div id="progress"><i></i></div>
  <div id="status"></div>
  <div id="wordcount"></div>

  <div class="hint">
    Open an AI conversation, then click a format above to export.
    Labels are saved automatically when you export.
    The theme applies to this popup and to .html exports.
  </div>

  <div class="hint">File saves to your browser's default Downloads folder.</div>

  <!-- Versiunea, la vedere. Ceruta de Starlight (27.08.2026): unealta nu-si
       spunea numarul nicaieri — nici in UI, nici in README. Se citeste din
       manifest la runtime, deci nu poate ramane in urma fata de build. -->
  <div class="hint" id="version"></div>

  <!-- v1.5 media export: pure helpers + zip writer must load before popup.js -->
  <script src="media-utils.js"></script>
  <script src="word-ruler.js"></script>
  <script src="zipwriter.js"></script>
  <script src="popup.js"></script>
</body>
</html>
